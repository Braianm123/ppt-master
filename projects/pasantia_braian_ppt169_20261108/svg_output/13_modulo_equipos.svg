      <text x="88" y="262">Inventario organizado<tspan x="88" dy="26">por área o gerencia</tspan></text>
      <text x="88" y="338"><tspan font-weight="bold">Ficha única:</tspan> código, tipo,<tspan x="88" dy="26">criticidad y frecuencia</tspan></text>
