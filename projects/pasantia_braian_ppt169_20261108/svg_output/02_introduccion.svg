<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="es-VE" data-pptx-page-role="content" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#1497C4"/>
    </marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F4F7FA"/>
  <g id="barra-avance" data-pptx-role="decoration" data-pptx-bounds="0 0 102 10">
    <rect x="0" y="0" width="102" height="10" fill="#1497C4"/>
  </g>
  <g id="titulo" data-pptx-bounds="60 40 1160 90" font-weight="bold">
    <text x="64" y="66" font-size="16" fill="#1497C4" letter-spacing="3">INTRODUCCIÓN</text>
    <text x="64" y="112" font-size="40" fill="#0B2545">Dónde y por qué se hizo la pasantía</text>
  </g>
  <g id="empresa" data-pptx-bounds="60 142 373 204">
    <rect x="60" y="146" width="373" height="196" rx="14" fill="#FFFFFF"/>
    <text x="84" y="176" font-size="13" font-weight="bold" fill="#1497C4" letter-spacing="2">LA EMPRESA</text>
    <text x="84" y="204" font-size="20" font-weight="bold" fill="#0B2545">CVG Ferrominera Orinoco</text>
    <g font-size="15" fill="#4A5A6A">
      <text x="84" y="236">Extrae, procesa y vende mineral de hierro</text>
      <text x="84" y="262">Estatal, activa desde 1976 · edo. Bolívar</text>
      <text x="84" y="288">Plantas: PMH, Pellas y Briquetas</text>
      <text x="84" y="314">Principal proveedor de la siderurgia</text>
    </g>
  </g>
  <g id="unidad" data-pptx-bounds="453 142 373 204">
    <rect x="453" y="146" width="373" height="196" rx="14" fill="#FFFFFF"/>
    <text x="477" y="176" font-size="13" font-weight="bold" fill="#1497C4" letter-spacing="2">LA UNIDAD</text>
    <text x="477" y="204" font-size="20" font-weight="bold" fill="#0B2545">Refrigeración Industrial</text>
    <g font-size="15" fill="#4A5A6A">
      <text x="477" y="236">Gerencia de Servicios</text>
      <text x="477" y="262">Dpto. de Servicios Industriales</text>
      <text x="477" y="288">21 posiciones · 14 técnicos de frío</text>
      <text x="477" y="314">Preventivo y correctivo de los equipos</text>
    </g>
  </g>
  <g id="pasantia" data-pptx-bounds="846 142 374 204">
    <rect x="846" y="146" width="374" height="196" rx="14" fill="#0B2545"/>
    <text x="870" y="176" font-size="13" font-weight="bold" fill="#5BC8E8" letter-spacing="2">LA PASANTÍA</text>
    <text x="870" y="204" font-size="20" font-weight="bold" fill="#FFFFFF">Ingeniería Industrial · UNEG</text>
    <g font-size="15" fill="#C9D6E3">
      <text x="870" y="236">Tutor industrial: Ing. Jorge Rosas</text>
      <text x="870" y="262">Tutor académico: Ing. Yuswaldo Silva</text>
      <text x="870" y="288">Plan de 9 actividades</text>
      <text x="870" y="314">Alcance: propuesta, no implantación</text>
    </g>
  </g>
  <g id="premisa" data-pptx-bounds="60 356 1160 40">
    <text x="64" y="384" font-size="20" fill="#0B2545">El preventivo solo es efectivo si se <tspan font-weight="bold" fill="#1497C4">ejecuta, se registra, se sigue y se mide.</tspan></text>
  </g>
  <g id="ciclo" data-pptx-bounds="60 400 1160 132">
    <g stroke="#1497C4" stroke-width="3">
      <line x1="238" y1="440" x2="438" y2="440" marker-end="url(#flecha)"/>
      <line x1="518" y1="440" x2="718" y2="440" marker-end="url(#flecha)"/>
      <line x1="798" y1="440" x2="998" y2="440" marker-end="url(#flecha)"/>
    </g>
    <g fill="#0B2545">
      <circle cx="200" cy="440" r="32"/>
      <circle cx="480" cy="440" r="32"/>
      <circle cx="760" cy="440" r="32"/>
    </g>
    <circle cx="1040" cy="440" r="32" fill="#1497C4"/>
    <use data-icon="tabler-filled/settings" x="186" y="426" width="28" height="28" fill="#FFFFFF"/>
    <use data-icon="tabler-filled/clipboard-check" x="466" y="426" width="28" height="28" fill="#FFFFFF"/>
    <use data-icon="tabler-filled/eye-table" x="746" y="426" width="28" height="28" fill="#FFFFFF"/>
    <use data-icon="tabler-filled/chart-pie" x="1026" y="426" width="28" height="28" fill="#FFFFFF"/>
    <g text-anchor="middle">
      <g font-size="18" font-weight="bold" fill="#0B2545">
        <text x="200" y="496">Ejecutar</text>
        <text x="480" y="496">Registrar</text>
        <text x="760" y="496">Seguir</text>
        <text x="1040" y="496">Medir</text>
      </g>
      <g font-size="14" fill="#4A5A6A">
        <text x="200" y="518">Tareas planificadas</text>
        <text x="480" y="518">Datos por equipo</text>
        <text x="760" y="518">Historial y alertas</text>
        <text x="1040" y="518">Confiabilidad</text>
      </g>
    </g>
  </g>
  <g id="contexto" data-pptx-bounds="60 544 1160 110">
    <rect x="60" y="548" width="1160" height="102" rx="14" fill="#1497C4" fill-opacity="0.10"/>
    <text x="92" y="580" font-size="17" font-weight="bold" fill="#0B2545">¿Por qué refrigeración?</text>
    <text x="92" y="606" font-size="15" fill="#4A5A6A">Confort del personal, resguardo de documentos<tspan x="92" dy="22">y equipos sensibles, procesos que lo exigen.</tspan></text>
    <text x="672" y="580" font-size="17" font-weight="bold" fill="#0B2545">La realidad encontrada</text>
    <text x="672" y="606" font-size="15" fill="#4A5A6A">Parque numeroso y disperso, control informal<tspan x="672" dy="22">y sin el sistema que antes concentraba los datos.</tspan></text>
  </g>
  <g id="pie" data-pptx-role="footer" data-pptx-bounds="60 676 1160 28" fill="#6B7A89" font-size="14">
    <text x="64" y="696">Braian Moreno · Pasantía CVG Ferrominera Orinoco</text>
    <text x="1216" y="696" font-weight="bold" text-anchor="end">02</text>
  </g>
</svg>
