    <rect x="709" y="222" width="451" height="356" rx="8" fill="#FFFFFF" filter="url(#softShadow)"/>
    <image href="../images/image_021.png" x="717" y="230" width="435" height="340" preserveAspectRatio="xMidYMid meet"/>
