<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="es-VE" data-pptx-page-role="content" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B2545" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F4F7FA"/>
  <g id="barra-avance" data-pptx-role="decoration" data-pptx-bounds="0 0 1024 10">
    <rect x="0" y="0" width="1024" height="10" fill="#1497C4"/>
  </g>
  <g id="titulo" data-pptx-bounds="60 40 1160 90" font-weight="bold">
    <text x="64" y="66" font-size="16" fill="#1497C4" letter-spacing="3">MÁS VISTAS · 3 DE 3</text>
    <text x="64" y="112" font-size="40" fill="#0B2545">Trazabilidad completa</text>
  </g>
  <g id="vista-historial" data-pptx-bounds="60 146 560 470">
