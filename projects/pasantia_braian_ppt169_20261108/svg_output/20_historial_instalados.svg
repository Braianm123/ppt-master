    <rect x="119" y="222" width="443" height="356" rx="8" fill="#FFFFFF" filter="url(#softShadow)"/>
    <image href="../images/image_020.png" x="127" y="230" width="427" height="340" preserveAspectRatio="xMidYMid meet"/>
    <text x="119" y="604" font-size="14" fill="#6B7A89">Figura 17 · Historial de atenciones (90 días)</text>
  </g>
  <g id="vista-instalados" data-pptx-bounds="660 146 560 470">
