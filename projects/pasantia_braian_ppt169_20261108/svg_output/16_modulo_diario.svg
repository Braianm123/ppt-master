  <g id="titulo" data-pptx-bounds="60 40 1160 90" font-weight="bold">
    <text x="64" y="66" font-size="16" fill="#1497C4" letter-spacing="3">MÓDULO 05 DE 06</text>
    <text x="64" y="112" font-size="40" fill="#0B2545">Diario · lo hecho cada día</text>
  </g>
  <g id="descripcion" data-pptx-bounds="60 150 380 240">
