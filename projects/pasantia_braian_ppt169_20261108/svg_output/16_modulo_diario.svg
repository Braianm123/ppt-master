      <rect x="64" y="248" width="12" height="12" rx="2"/>
      <rect x="64" y="324" width="12" height="12" rx="2"/>
    </g>
    <g font-size="20" fill="#0B2545">
      <text x="88" y="186">Todo lo realizado en<tspan x="88" dy="26">una fecha específica</tspan></text>
      <text x="88" y="262">Preventivos, correctivos,<tspan x="88" dy="26">jornadas, lecturas, instalaciones</tspan></text>
      <text x="88" y="338">Responde al instante:<tspan x="88" dy="26" font-weight="bold">¿qué se atendió ese día?</tspan></text>
