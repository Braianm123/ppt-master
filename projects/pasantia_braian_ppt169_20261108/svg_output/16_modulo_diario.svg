    <text x="76" y="490">02 · Equipos</text>
    <text x="76" y="520">03 · Registrar</text>
    <text x="76" y="550">04 · Jornadas</text>
    <text x="76" y="580" font-weight="bold" fill="#0B2545">05 · Diario</text>
    <text x="76" y="610">06 · Análisis</text>
